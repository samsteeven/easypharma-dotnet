name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore EasyPharma.slnx

      - name: Build
        run: dotnet build EasyPharma.slnx --no-restore -c Release

      # Les tests d'intégration démarrent un vrai SQL Server via Testcontainers (Docker présent sur le runner).
      - name: Test
        run: dotnet test EasyPharma.slnx --no-build -c Release --logger "trx;LogFileName=results.trx"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Build du front Angular
        working-directory: web
        run: |
          npm ci
          npx ng build
